[package]
name = "amyu-desktop"
version = "0.1.0"
description = "AMYU foundation and Avatar Lab native host"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "amyu_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
