name: Windows Pet Shell

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-build.yml'
      - 'apps/**'
      - 'packages/**'
      - 'assets/**'
      - 'scripts/**'
      - '*config*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

concurrency:
  group: windows-pet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build and test Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/work/native-target
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.19.0
      - name: Prepare Rust
        run: |
          rustup default stable-msvc
          rustup component add rustfmt
          rustc --version
          cargo --version
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend checks
        run: pnpm check
      - name: Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - name: Rust tests
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build executable and NSIS installer
        id: native-build
        run: pnpm --filter @amyu/desktop native:build
      - name: Production process smoke check
        run: ./scripts/windows-smoke.ps1 -Executable ./work/native-target/release/amyu-desktop.exe -Report ./work/native-smoke.json
      - name: Prepare artifact checksums
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: |
          New-Item -ItemType Directory -Path work/windows-artifact -Force | Out-Null
          Copy-Item work/native-target/release/amyu-desktop.exe work/windows-artifact/AMYU.exe
          Copy-Item work/native-target/release/bundle/nsis/*.exe work/windows-artifact/
          if (Test-Path work/native-smoke.json) { Copy-Item work/native-smoke.json work/windows-artifact/ }
          Copy-Item assets/character/third-party/LICENSE.md work/windows-artifact/THIRD-PARTY-ASSETS.md
          Get-ChildItem work/windows-artifact/*.exe | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content work/windows-artifact/SHA256SUMS.txt
          "Source commit: $env:GITHUB_SHA`nUnsigned prototype build. Requires Microsoft WebView2. No release was published. Process smoke is not visual acceptance." | Set-Content work/windows-artifact/BUILD.txt
      - name: Upload Windows build
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: AMYU-Windows-x64-${{ github.sha }}
          path: work/windows-artifact/
          if-no-files-found: error
          retention-days: 30
